name: Build DCraft APK

on:
  push:
    branches: [ "v3_openjdk" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DCraft-Launcher-APK
          path: app_pojavlauncher/build/outputs/apk/full/debug/*.apk
